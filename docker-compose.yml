services:
  # ── Qdrant vector DB (used by mem0 service) ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  # ── mem0 semantic cache service ───────────────────────────────────────────────
  mem0:
    build:
      context: ./mem0_service
      dockerfile: Dockerfile
    image: recursivemas-mem0:latest
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

  # ── Batch evaluation ────────────────────────────────────────────────────────
  recursivemas:
    build: .
    image: recursivemas:latest
    # Requires NVIDIA Container Toolkit on the host:
    # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    depends_on:
      - mem0
    volumes:
      - hf_cache:/hf_cache
    # Override with your desired --style, --dataset, etc.
    command:
      - --style
      - sequential_light
      - --dataset
      - math500
      - --device
      - cuda

  # ── Web UI (Gradio) ─────────────────────────────────────────────────────────
  serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    image: recursivemas-serve:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    depends_on:
      - mem0
    volumes:
      - hf_cache:/hf_cache
    ports:
      - "${SERVE_PORT:-7860}:7860"
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "7860"

volumes:
  hf_cache:
  qdrant_data:
