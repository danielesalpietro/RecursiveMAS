services:
  # ── Qdrant vector DB (used by mem0 service) ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  # ── mem0 semantic cache service ───────────────────────────────────────────────
  mem0:
    build:
      context: ./mem0_service
      dockerfile: Dockerfile
    image: recursivemas-mem0:latest
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEM0_THRESHOLD=${MEM0_THRESHOLD:-0.92}
      # Uncomment to enable LLM-based memory extraction (requires valid quota):
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "${MEM0_PORT:-8080}:8080"

  # ── Batch evaluation ────────────────────────────────────────────────────────
  recursivemas:
    build: .
    image: recursivemas:latest
    # Requires NVIDIA Container Toolkit on the host:
    # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - mem0
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MEM0_URL=http://mem0:8080
      - MEM0_THRESHOLD=${MEM0_THRESHOLD:-0.92}
    volumes:
      - hf_cache:/hf_cache
    # Override with your desired --style, --dataset, etc.
    command:
      - --style
      - sequential_light
      - --dataset
      - math500
      - --device
      - cuda

  # ── Web UI (Gradio) ─────────────────────────────────────────────────────────
  serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    image: recursivemas-serve:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - mem0
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_COMPAT_ENDPOINT=${OPENAI_COMPAT_ENDPOINT:-}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:-}
      - MEM0_URL=http://mem0:8080
      - MEM0_THRESHOLD=${MEM0_THRESHOLD:-0.92}
    volumes:
      - hf_cache:/hf_cache
    ports:
      - "${SERVE_PORT:-7860}:7860"
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "7860"

volumes:
  hf_cache:
  qdrant_data:
